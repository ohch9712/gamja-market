# 실행: docker compose up -d
# 기본 접속 주소: postgresql://gamja:gamja_local_password@localhost:5432/gamja_market
# 아래 기본 계정 정보는 로컬 개발용입니다.
name: gamja-market

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamja_market}
      POSTGRES_USER: ${POSTGRES_USER:-gamja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamja_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
