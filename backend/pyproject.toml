[project]
name = "gamja-market-backend"
version = "0.1.0"
description = "감자마켓 FastAPI 백엔드"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
